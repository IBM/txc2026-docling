# Builds the two lab-2775 images and pushes them to this repo's GHCR:
#   ghcr.io/<owner>/<repo>/lab-2775-pipeline   (images/pipeline.Dockerfile, the Flink job for CMF)
#   ghcr.io/<owner>/<repo>/lab-2775-trigger    (images/trigger.Dockerfile, the Code Engine app)
#
# Tags:
#   pull request  -> pr-<number>
#   push to main  -> main-<short sha>
#   tag vX.Y.Z    -> X.Y.Z, X.Y, and latest
# `latest` therefore always points at the last release, never at main.
name: lab-2775 images

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Not evaluated for tag pushes: a release always builds.
    paths:
      - "lab-2775/**"
      - ".github/workflows/lab-2775-images.yml"
  pull_request:
    paths:
      - "lab-2775/**"
      - ".github/workflows/lab-2775-images.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [pipeline, trigger]
    defaults:
      run:
        working-directory: lab-2775
    env:
      # A PR from a fork gets a read-only token: build, but do not push.
      PUSH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v5

      # GHCR image names must be lowercase; the org is "IBM".
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/lab-2775-${{ matrix.image }}" >> "$GITHUB_ENV"

      # The Kafka connector jar is gitignored; the pipeline image COPYs jars/.
      - name: Fetch Flink connector jars
        if: matrix.image == 'pipeline'
        run: ./scripts/fetch_jars.sh

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=ref,event=pr,prefix=pr-
            type=sha,prefix=main-,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch,enable=${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' }}

      # linux/amd64 only: CMF and Code Engine both run amd64, and an arm64
      # pipeline build compiles pemja from source under qemu.
      - uses: docker/build-push-action@v6
        with:
          context: lab-2775
          file: lab-2775/images/${{ matrix.image }}.Dockerfile
          platforms: linux/amd64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=lab-2775-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=lab-2775-${{ matrix.image }}
