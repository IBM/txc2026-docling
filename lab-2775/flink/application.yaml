# FlinkApplication — the chunk-enrichment pipeline, declaratively.
#
#   confluent flink application create --environment flink-env flink/application.yaml
#
# The imperative equivalent, which renders this same shape from .env and POSTs
# it to the CMF REST API without needing the CLI, is:
#
#   ./scripts/cmf.sh deploy enrich
#
# Use whichever fits: this file is the artefact you check in and review; the
# script is what you run while iterating, because it picks up .env changes.
#
# Job: pipeline.enrich_job
#   docling.chunks -> prepare -> embed -> sink   (stateless; dedup and the PII
#   guard belong to pipeline.full_job, deployed with `scripts/cmf.sh deploy full`)
#
# Notes for the hosted test system (its address lives only in .env):
#   * The chunk topic is written from outside the cluster by Docling's
#     kafka_chunks target (scripts/saas_ingest.py). Flink only consumes it.
#   * In-cluster Kafka is the internal listener, PLAINTEXT, no credentials —
#     so this application needs no Kafka secrets at all. Adding `opensearch` to
#     SINK_TYPE does need two things: the password (a Secret) and the CA that
#     signed the cluster's certificate (a file, mounted from the same Secret) —
#     see flink/application-workshop.json.tmpl, which does both.
#     If your cluster exposes only the secured listener internally, switch
#     KAFKA_BOOTSTRAP_SERVERS to kafka.confluent.svc.cluster.local:9092, set
#     KAFKA_SECURITY_PROTOCOL=SASL_SSL, add KAFKA_API_KEY / KAFKA_API_SECRET
#     from a Secret, and point KAFKA_CA_LOCATION at a mounted copy of the
#     broker CA (the Java Kafka client has no "skip verification" option).
#   * PyFlink jar in cp-flink:2.1.3-cp2 is flink-python-2.1.3-cp2.jar.
#   * flinkVersion is v2_1 because that is the newest this CMF accepts — v2_2
#     would need CMF >= 2.4.1 (cp-flink-kubernetes-operator 1.15.x) and is
#     rejected at create time with "not one of the values accepted for Enum".
#   * The job is run as a module (-pym) so package imports resolve.
apiVersion: cmf.confluent.io/v1
kind: FlinkApplication
metadata:
  name: docling-chunk-enrich
spec:
  image: icr.io/txc26-dcls-dev/docling-ingest-pyflink:0.1.0
  imagePullPolicy: Always
  flinkVersion: v2_1
  serviceAccount: flink
  flinkConfiguration:
    taskmanager.numberOfTaskSlots: "2"
    restart-strategy: exponential-delay
    # Both of these, or the TaskManager dies with
    #   java.io.IOException: Cannot run program "python": No such file or directory
    # The runtime image has no `python` on PATH — only the relocatable venv the
    # builder stage copied in. -pyclientexec below covers only the client that
    # builds the job graph, so submission succeeds and the *tasks* restart-loop.
    python.executable: /opt/flink/pyflink/.venv/bin/python3
    python.client.executable: /opt/flink/pyflink/.venv/bin/python3
  jobManager:
    resource: { memory: 1024m, cpu: 1 }
  taskManager:
    resource: { memory: 4096m, cpu: 2 }
  job:
    jarURI: local:///opt/flink/opt/flink-python-2.1.3-cp2.jar
    entryClass: org.apache.flink.client.python.PythonDriver
    args:
      - -pyclientexec
      - /opt/flink/pyflink/.venv/bin/python3
      - -pym
      - pipeline.enrich_job
    parallelism: 2
    upgradeMode: stateless
    state: running
  # No apiVersion/kind here: this CMF validates podTemplate as a bare
  # PodTemplateSpec and rejects them with "contains unexpected field(s)".
  podTemplate:
    metadata:
      name: pod-template
    spec:
      imagePullSecrets:
        - name: txc26-dcls-dev-conflient-read-pull-secret
      containers:
        - name: flink-main-container
          env:
            - { name: KAFKA_BOOTSTRAP_SERVERS, value: "kafka.confluent.svc.cluster.local:9071" }
            - { name: KAFKA_SECURITY_PROTOCOL, value: "PLAINTEXT" }
            - { name: KAFKA_CHUNKS_TOPIC, value: "docling.chunks" }
            - { name: KAFKA_CONSUMER_GROUP, value: "chunk-pipeline" }
            # SINK_TYPE names a *list* of terminals, and this bare example
            # names one: the finished records go to a topic and
            # scripts/drain_topic.py reads them back, with nothing else to set
            # up. The workshop runs "kafka,opensearch" — both at once — which
            # additionally needs OPENSEARCH_HOSTS / _INDEX / _USERNAME, the
            # password from a Secret and the private CA as a mounted file.
            - { name: SINK_TYPE, value: "kafka" }
            - { name: KAFKA_OUTPUT_TOPIC, value: "docling.chunks.enriched" }
            - { name: EMBEDDING_MODEL_ID, value: "ibm/granite-embedding-278m-multilingual" }
            - { name: CHUNK_TOKENIZER_ID, value: "ibm-granite/granite-embedding-278m-multilingual" }
            - { name: WATSONX_URL, value: "https://ca-tor.ml.cloud.ibm.com" }
            # Set to your watsonx.ai project. WATSONX_SPACE_ID is the alternative.
            - { name: WATSONX_PROJECT_ID, value: "" }
            # Never a literal: create the secret first, e.g.
            #   kubectl -n confluent create secret generic watsonx-embeddings \
            #     --from-literal=apikey=<ibm cloud api key>
            - name: WATSONX_APIKEY
              valueFrom:
                secretKeyRef: { name: watsonx-embeddings, key: apikey }
            - { name: EMBEDDING_DIMENSION, value: "768" }
            - { name: EMBEDDING_MAX_TOKENS, value: "512" }
            - { name: PIPELINE_MIN_CHARS, value: "40" }
            - { name: PIPELINE_DROP_LOW_QUALITY, value: "false" }
            # Read by pipeline.full_job only; enrich_job wires no dedup stage.
            - { name: PIPELINE_DEDUP, value: "true" }
            - { name: PIPELINE_EMBED, value: "true" }
            - { name: PIPELINE_PARALLELISM, value: "2" }
