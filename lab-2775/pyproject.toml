# One place for every Python dependency in this repo, managed with uv.
#
#   uv sync                     the laptop: scripts/, tests, linting
#   uv sync --group dashboard   ...and the inspector UI
#   uv run pytest               anything, without activating a venv
#
# `uv sync` installs the project *editable* (see [build-system] below), so a
# code change needs no reinstall and nothing has to manage sys.path. The image
# is the one place PYTHONPATH survives: it installs dependencies with
# --no-install-project and copies a single package in.
# The five packages under src/ are installed *editable* by `uv sync`, which is
# what makes `import pipeline` / `inspector` / `labtools` work in the tests, the
# scripts and the dashboard with no PYTHONPATH and no sys.path patching
# anywhere. The images do NOT install the project — they pass
# --no-install-project and copy the one package they need onto PYTHONPATH, so
# neither image can pick up another component. See images/*.Dockerfile.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/pipeline",
    "src/producer",
    "src/labtools",
    "src/docling_trigger",
    "src/inspector",
]

[project]
name = "docling-ingest-pipeline"
version = "0.1.0"
description = "PyFlink DataStream jobs over Docling's chunk topic, deployed on Confluent via CMF."
readme = "README.md"
requires-python = ">=3.10"
# Empty on purpose: nothing is a dependency of *every* environment here. The
# image and the laptop install disjoint sets — see the groups below.
dependencies = []

[dependency-groups]
# --- what the pipeline image installs (Dockerfile) -------------------------
# Three packages, because the job does three things: consume Kafka, call
# watsonx.ai over HTTP, and optionally write OpenSearch. Conversion and
# chunking happen in Docling, outside Flink, so no docling / transformers /
# torch is installed here at all.
#
# apache-flink must match the Flink version in the base image
# (cp-flink:2.1.3-cp2 -> Flink 2.1). 2.1, not 2.2, because the CMF this deploys
# to rejects `flinkVersion: v2_2` ("not one of the values accepted": v1_18..v2_1)
# and the operator's version must be the image's. The cost is async I/O:
# AsyncFunction / AsyncDataStream reach the Python DataStream API only in 2.2,
# so those stages stay unavailable until CMF is >= 2.4.1.
image = [
    "apache-flink==2.1.3",
    "requests==2.32.3",
    "opensearch-py==2.8.0",
]

# --- what the trigger image installs (images/trigger.Dockerfile) ----------
# The Code Engine app, and deliberately not the pipeline's set: nothing here
# needs pyflink, docling or a tokenizer, so the image is ~150 MB and builds in
# seconds on any architecture. It was `trigger/requirements.txt` until the
# component moved under src/ — the reason it lived outside this file was that
# its Docker context could not see it, which is no longer true.
#
# The Docling request is built as a plain dict (src/docling_trigger/submit.py),
# so the docling SDK is not a dependency — which also sidesteps the SDK's
# exclude_defaults bug that scripts/saas_ingest.py has to patch around.
trigger = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "httpx>=0.27,<1",
]

# --- what a laptop needs to run scripts/ ----------------------------------
# Installed by default (`uv sync`). Docling is here and not in the image
# because conversion and chunking happen in the Docling service, never in
# Flink: `scripts/saas_ingest.py` submits to the SaaS, and
# `scripts/ingest_folder.py` converts local files, which the SaaS cannot fetch.
# `transformers` supplies only the *tokenizer* that sizes chunks; it imports
# torch lazily, so nothing here pulls in a tensor library. It is left unpinned
# on purpose — docling-slim caps it, and pinning it here just makes the two
# disagree.
local = [
    "confluent-kafka>=2.15,<3",
    "requests>=2.32",
    "opensearch-py>=2.8,<3",
    "docling-slim[service-client,feat-chunking]>=2.120.3",
    "transformers",
    # lab.yaml is the student's whole configuration; labtools.config reads it.
    "pyyaml>=6,<7",
]

# Converting on the laptop instead of in the service — `ingest_folder.py --via
# local`. Its own group because it is the only thing in the repo that wants
# *full* docling and therefore torch: half a gigabyte for a fallback path that
# exists because Docling cannot fetch a local file.
convert = [
    "docling>=2.119",
]

dev = [
    "pytest>=8",
    "ruff>=0.14",
    # tests/test_trigger_*.py exercise the Code Engine app in-process.
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
]

# --- the inspector UI (dashboard/) ----------------------------------------
# Not installed by default: it is a laptop-only Streamlit app, and a student
# who only deploys a pipeline never starts it. `dashboard/run.sh` syncs it into
# its own environment (dashboard/.venv) so a Streamlit upgrade can never move
# anything the pipeline depends on.
dashboard = [
    "streamlit>=1.49,<2",
    "confluent-kafka>=2.15,<3",
    "requests>=2.32",
    "opensearch-py>=2.8,<3",
    "pyyaml>=6,<7",
]

[tool.uv]
default-groups = ["local", "dev"]
# The image's set and the laptop's cannot be resolved together, and it is not a
# version skew that a bump would fix: apache-flink depends on apache-beam,
# which pins `dill<0.3.2`, while docling's chunker reaches `mpire[dill]` ->
# `multiprocess`, whose only dill-0.3.1-compatible release (0.70.9) has no
# wheel, hangs forever in `setup.py` on Python >= 3.9, and is broken at import
# where it does build. Declaring the conflict makes uv resolve the two forks
# separately instead of pinning something artificial to force them together —
# and it is true: no environment ever wants both.
conflicts = [
    [{ group = "image" }, { group = "local" }],
    [{ group = "image" }, { group = "convert" }],
]

# Neither image installs the project itself — they pass --no-install-project and
# copy a single package in — so hatchling never has to build a wheel inside a
# Docker layer that has no source yet.

[tool.pytest.ini_options]
# No `pythonpath`: the project is installed editable, so every package under
# src/ imports by name — including the inspector's own pure helpers (rag.py,
# which builds the prompt and the search body and imports neither streamlit nor
# pyflink, precisely so it can be tested here).
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "scripts", "tests"]
